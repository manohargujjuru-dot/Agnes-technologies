<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Service | Vertexa Technologies</title>
  <meta name="description" content="Service details, capabilities, process and enquiry form.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="service">
  <a class="skip-link" href="#main">Skip to content</a>
  <header id="site-header"></header>
  <main id="main">
    <section class="page-banner">
      <div class="container banner-grid">
        <div>
          <nav class="breadcrumbs" aria-label="Breadcrumb"><ol><li><a href="index.html">Home</a></li><li><a href="services.html">Services</a></li><li id="crumb" aria-current="page"></li></ol></nav>
          <span class="eyebrow anim" id="svc-eyebrow"></span>
          <h1 class="anim d1" id="svc-title"></h1>
          <p class="lead anim d2" id="svc-lead"></p>
          <div class="btn-row anim d3"><a id="svc-cta" href="#enquiry" class="btn btn-primary"></a><a href="services.html" class="btn btn-outline">All Services</a></div>
        </div>
        <div class="banner-art anim-scale" id="svc-art"></div>
      </div>
    </section>

    <section class="section">
      <div class="container">
        <div class="section-head reveal"><h2 id="svc-types-title"></h2></div>
        <div class="grid grid-3" id="svc-types"></div>
      </div>
    </section>

    <section class="section alt">
      <div class="container split">
        <div class="reveal">
          <h2 id="svc-caps-title"></h2>
          <ul class="check-list" id="svc-caps"></ul>
          <div id="svc-note"></div>
        </div>
        <div class="split-art reveal" data-art="artTeam"></div>
      </div>
    </section>

    <section class="section" id="svc-process-wrap"><div class="container" id="svc-process"></div></section>
    <section class="section alt" id="svc-extra-wrap"><div class="container" id="svc-extra"></div></section>

    <section class="section" id="enquiry">
      <div class="container" style="max-width:860px">
        <div class="section-head reveal"><span class="eyebrow">Enquiry</span><h2 id="svc-form-title"></h2><p>Share a few details and our team will be in touch.</p></div>
        <div class="form-card reveal" id="svc-form"></div>
      </div>
    </section>
  </main>
  <footer id="site-footer"></footer>
  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
  <script>if (!document.getElementById("svc-extra").innerHTML.trim()) document.getElementById("svc-extra-wrap").remove();</script>
</body>
</html>
